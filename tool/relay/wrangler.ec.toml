name = "ec-stitchpad-relay"
main = "worker.js"
account_id = "d5fbf64067844a591842c14f1b53bd79"
compatibility_date = "2026-06-01"
keep_vars = true

routes = [
  { pattern = "ec-pasture.agentsworld.org", custom_domain = true }
]

[[kv_namespaces]]
binding = "STITCHPAD"
id = "ece3b246a32742d092c869d038bbe02f"

[[durable_objects.bindings]]
name = "PADHUB"
class_name = "PadHub"

[[migrations]]
tag = "v1-padhub"
new_sqlite_classes = ["PadHub"]

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ec-stitchpad-images"

[vars]
INVITES_DISABLED = "false"

[assets]
directory = "../pwa"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
